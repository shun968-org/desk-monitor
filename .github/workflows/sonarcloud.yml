name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SONAR_TOKEN 未設定(フォークPR等)の場合はスキャンせず成功扱いにする
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.organization=shun968-org
            -Dsonar.projectKey=shun968-org_desk-monitor
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,assets/**,**/*.png
